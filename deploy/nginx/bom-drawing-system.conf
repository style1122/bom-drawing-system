# BOM 图纸管理系统 —— nginx for Windows 站点配置
# 用法：将该文件放入 nginx/conf/，并在 nginx.conf 的 http 块内添加：
#       include bom-drawing-system.conf;
# 然后以管理员身份运行 nginx.exe 启动。

server {
    listen 80;
    server_name localhost;

    # ---------- Vue 前端静态资源 ----------
    root C:/apps/bom-drawing-system/frontend/dist;
    index index.html;

    # ---------- 后端 API 反向代理 ----------
    # 注意：proxy_pass 末尾不带 URI，nginx 会把完整 /api/... 透传给后端
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图纸大文件上传，延长超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    # ---------- SPA 前端路由兜底（Vue Router history 模式）----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
