# =============================================
# 正航 T9 ERP ESB 对接配置（物料基础数据 Mat01）
# =============================================

# ESB 服务地址（含端口，正航 ESB 端口为 860）
erp.base-url=http://10.1.1.15:860

# 认证凭据（由正航提供）
erp.appid=chiesbeac90d2bcca79c04
erp.appsecret=5EBABC79A0AD621B6CFCEA67C92C3064

# 功能编号（物料基础数据）
erp.progid=Mat01

# 认证语言：zh-CHS<中文(简体)> / zh-CHT<中文(繁体)> / en<English>
erp.language=zh-CHS

# 请求 time 参数格式：millis6=UTC毫秒+6位随机数；datetime14=yyyyMMddHHmmss
erp.time-format=millis6

# 连接超时 / 读取超时（毫秒）
erp.connect-timeout=10000
erp.read-timeout=120000

# ERP 订阅同步（物料异动实时通知 + 订阅查询）
erp.subscribe.enabled=true
erp.subscribe.sscrid=MA01
# 无游标时首次查询的起始时间戳
erp.subscribe.init-timestamp=2018-01-01 00:00:00
# 可选回调密钥：配置后 ERP 回调需在请求头 X-Subscribe-Secret 携带相同值
erp.subscribe.secret=
# 兜底轮询（实时通知正常时可关闭；默认开启，间隔 5 分钟）
erp.subscribe.poll.enabled=true
erp.subscribe.poll.interval-ms=300000
